name: Build Windows Installer (.EXE)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Build Production Windows Executable (.EXE)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Normalize Public NPM Package Versions
        run: |
          node --input-type=module -e "
          import fs from 'fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies = {
            '@google/genai': '^1.0.0',
            '@tailwindcss/vite': '^4.0.9',
            '@vitejs/plugin-react': '^4.3.4',
            'firebase': '^11.4.0',
            'lucide-react': '^0.475.0',
            'react': '^19.0.0',
            'react-dom': '^19.0.0',
            'vite': '^6.2.0',
            'express': '^4.21.2',
            'dotenv': '^16.4.7',
            'motion': '^12.4.7'
          };
          pkg.devDependencies = {
            '@types/express': '^4.17.21',
            '@types/node': '^22.13.5',
            '@types/react': '^19.0.10',
            '@types/react-dom': '^19.0.4',
            'autoprefixer': '^10.4.20',
            'electron': '^34.2.0',
            'electron-builder': '^25.1.8',
            'esbuild': '^0.25.0',
            'tailwindcss': '^4.0.9',
            'tsx': '^4.19.2',
            'typescript': '^5.7.3',
            'vite-plugin-pwa': '^0.21.1'
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          if (fs.existsSync('package-lock.json')) fs.unlinkSync('package-lock.json');
          if (fs.existsSync('bun.lock')) fs.unlinkSync('bun.lock');
          "

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Both Master & User Windows Executables (.EXE)
        run: node scripts/build-dual-installers.mjs
        env:
          CI: false
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_APP_BUILD_VERSION: "1.0.${{ github.run_number }}"

      - name: Upload Master & User Windows Installer Artifacts (.EXE)
        uses: actions/upload-artifact@v4
        with:
          name: AKASH-TUNNEL-MAPPER-Master-and-User-Installers
          path: |
            release/AKASH-TUNNEL-MAPPER-Master-Setup.exe
            release/AKASH-TUNNEL-MAPPER-User-Setup.exe
            release/latest-release.json
          if-no-files-found: error

      - name: Publish Master & User .EXE Installers to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: "AKASH TUNNEL MAPPER - Latest Master & User Windows Installers (.EXE)"
          body: |
            ### Official Windows Desktop Executables (.EXE)
            1. **Normal User Software (Share with Users):** `AKASH-TUNNEL-MAPPER-User-Setup.exe`
               - Direct Link for Users: `https://github.com/${{ github.repository }}/releases/download/latest/AKASH-TUNNEL-MAPPER-User-Setup.exe`
               - Includes 1-PC One-Time Login, Request Access, and Live Software Updates.
            2. **Master Software (Owner Only):** `AKASH-TUNNEL-MAPPER-Master-Setup.exe`
               - Direct Link for Owner: `https://github.com/${{ github.repository }}/releases/download/latest/AKASH-TUNNEL-MAPPER-Master-Setup.exe`
               - Opens directly without login and includes the Master Admin Website on first opening.
          files: |
            release/AKASH-TUNNEL-MAPPER-Master-Setup.exe
            release/AKASH-TUNNEL-MAPPER-User-Setup.exe
            release/latest-release.json
          prerelease: false
