name: Build Windows Desktop Installer (.EXE)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows-exe:
    name: Build AKASH-TUNNEL-MAPPER-Setup.exe
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Normalize Public NPM Package Versions
        shell: node {0}
        run: |
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies = {
            "@google/genai": "^1.0.0",
            "@tailwindcss/vite": "^4.0.9",
            "@vitejs/plugin-react": "^4.3.4",
            "lucide-react": "^0.475.0",
            "react": "^19.0.0",
            "react-dom": "^19.0.0",
            "vite": "^6.2.0",
            "express": "^4.21.2",
            "dotenv": "^16.4.7",
            "motion": "^12.4.7"
          };
          pkg.devDependencies = {
            "@types/express": "^4.17.21",
            "@types/node": "^22.13.5",
            "@types/react": "^19.0.10",
            "@types/react-dom": "^19.0.4",
            "autoprefixer": "^10.4.20",
            "electron": "^34.2.0",
            "electron-builder": "^25.1.8",
            "esbuild": "^0.25.0",
            "tailwindcss": "^4.0.9",
            "tsx": "^4.19.2",
            "typescript": "^5.7.3"
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          if (fs.existsSync('package-lock.json')) fs.unlinkSync('package-lock.json');

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate 256x256 Windows Icon (.ico)
        run: node scripts/generate-win-icon.mjs

      - name: Build Frontend & Package Windows Installer (.EXE)
        run: npm run dist
        env:
          CI: false

      - name: Upload AKASH-TUNNEL-MAPPER-Setup.exe Installer
        uses: actions/upload-artifact@v4
        with:
          name: AKASH-TUNNEL-MAPPER-Windows-Installer
          path: release/AKASH-TUNNEL-MAPPER-Setup.exe
          if-no-files-found: error
