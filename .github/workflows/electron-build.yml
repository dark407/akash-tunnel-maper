name: Electron Windows Build & Installer Artifact

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: electron-windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron-build:
    name: Package Windows Installer (.EXE) via electron-builder
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Normalize Public NPM Package Versions for CI
        run: node scripts/normalize-ci-package.mjs

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Both Master & User Windows Executables (.EXE)
        run: node scripts/build-dual-installers.mjs
        env:
          CI: false
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_APP_BUILD_VERSION: "1.0.${{ github.run_number }}"

      - name: Upload Master & User Windows Installer Artifacts (.EXE)
        uses: actions/upload-artifact@v4
        with:
          name: AKASH-TUNNEL-MAPPER-Master-and-User-Installers
          path: |
            release/AKASH-TUNNEL-MAPPER-Master-Setup.exe
            release/AKASH-TUNNEL-MAPPER-User-Setup.exe
            release/latest-release.json
            release/*.blockmap
          if-no-files-found: error
          retention-days: 90

      - name: Update Rolling 'latest' Tag to Current Commit
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa latest -m "Latest Windows .EXE Build #${{ github.run_number }}"
          git push origin latest --force

      - name: Publish Master & User .EXE Installers to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          make_latest: true
          name: "AKASH TUNNEL MAPPER - Latest Master & User Windows Installers (.EXE) [Build #${{ github.run_number }}]"
          body: |
            ### Official Windows Desktop Executables (.EXE) — Build #${{ github.run_number }}
            1. **Normal User Software (Share with Users):** `AKASH-TUNNEL-MAPPER-User-Setup.exe`
               - Direct Link for Users: `https://github.com/${{ github.repository }}/releases/download/latest/AKASH-TUNNEL-MAPPER-User-Setup.exe`
            2. **Master Software (Owner Only):** `AKASH-TUNNEL-MAPPER-Master-Setup.exe`
               - Direct Link for Owner: `https://github.com/${{ github.repository }}/releases/download/latest/AKASH-TUNNEL-MAPPER-Master-Setup.exe`
          files: |
            release/AKASH-TUNNEL-MAPPER-Master-Setup.exe
            release/AKASH-TUNNEL-MAPPER-User-Setup.exe
            release/latest-release.json
          prerelease: false
